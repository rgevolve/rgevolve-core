[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rgevolve-core"
authors = [
    {name = "Aleks Smolkovič", email = "aleks.smolkovic@ijs.si"},
    {name = "Peter Stangl", email = "peter.stangl@cern.ch"},
]
description = "Package providing the core tools for Renormalization Group Evolution Matrices."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "numpy",
    "appdirs",
    "h5py",
    "xxhash>=2.0.0",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["rgevolve.tools", "rgevolve.matching"]

[tool.setuptools_scm]
version_file = "src/rgevolve/tools/_version.py"

[tool.setuptools.package-data]
"rgevolve.matching" = ["data.h5"]
